<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lunar Frontier 3D</title>
    <link rel="stylesheet" href="world.css" />
    <link rel="stylesheet" href="indie.css" />
    <link rel="stylesheet" href="player.css" />
    <link rel="stylesheet" href="flight.css" />
    <link rel="stylesheet" href="hud.css" />
  </head>
  <body>
    <canvas id="world"></canvas>
    <header>
      <b>◐ LUNAR FRONTIER<small>LANDED / SELENE</small></b>
      <button id="help">Controls & science</button>
    </header>
    <!-- Filled by hud.js: day, meters and stars; today's job and warnings; interact prompt. -->
    <section id="hud" aria-label="Ship status"></section>
    <section id="objective" aria-label="Today's job"></section>
    <div id="crosshair">+</div>
    <div id="prompt"></div>
    <!-- Same controls text as the in-game help (CONTROLS_TEXT in mission-panels.js). -->
    <footer>
      <span id="controls-help"
        >WASD / arrows move · Shift runs · Click and move the mouse to look (Esc to pause) · E uses
        a terminal · Space jumps</span
      >
      <button id="interact">Use terminal</button>
    </footer>
    <!-- Touch controls. presentation.js replaces the first div with a joystick. -->
    <div id="touch">
      <div>
        <button data-key="KeyW">▲</button>
        <div>
          <button data-key="KeyA">◀</button>
          <button data-key="KeyS">▼</button>
          <button data-key="KeyD">▶</button>
        </div>
      </div>
      <button id="jump">Jump</button>
    </div>
    <!-- Every panel and dialog renders into #modal (hud.js show()). -->
    <dialog id="dialog"><div id="modal"></div></dialog>
    <script src="engine.js"></script>
    <script type="module" src="world.js"></script>
  </body>
</html>
